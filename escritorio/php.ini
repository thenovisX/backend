; PHP de la app de escritorio (el lanzador arranca php.exe con -c y este archivo)
extension_dir = "ext"
extension = curl
extension = fileinfo
extension = gd
extension = mbstring
extension = exif
extension = openssl
extension = pdo_sqlite
extension = sqlite3
extension = sodium

date.timezone = Europe/Madrid
default_charset = "UTF-8"
memory_limit = 256M
max_execution_time = 60
post_max_size = 20M
upload_max_filesize = 16M
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
zend.exception_ignore_args = On
session.use_strict_mode = 1
opcache.enable = 1
opcache.enable_cli = 1
zend_extension = opcache
